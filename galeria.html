<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Galería fotográfica de la Asociación Vita Nova Colombia — comunidad, formación y actividades.">
<title>Galería — Vita Nova Colombia</title>
<link rel="icon" type="image/jpeg" href="assets/img/img_00.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<header class="page-hero" data-dark>
  <div class="ph-glow"></div><div class="ph-glow g2"></div>
  <span class="section-label">Nuestro trabajo en imágenes</span>
  <h1>Galería</h1>
  <p class="ph-sub">Momentos reales de nuestra comunidad — personas, procesos y transformaciones.</p>
</header>

<section id="galeria" style="background:var(--cream)" aria-label="Galería fotográfica">
  <div class="gallery-tabs" role="tablist" aria-label="Filtrar galería">
    <button class="gallery-tab active" data-range="all" role="tab" aria-selected="true">Todas</button>
    <button class="gallery-tab" data-range="0-11" role="tab" aria-selected="false">Comunidad</button>
    <button class="gallery-tab" data-range="12-22" role="tab" aria-selected="false">Formación</button>
    <button class="gallery-tab" data-range="23-33" role="tab" aria-selected="false">Actividades</button>
  </div>
  <div class="gallery-grid" id="gallery-grid"></div>
</section>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Visor de imágenes">
  <button class="lb-btn lb-close" aria-label="Cerrar">✕</button>
  <button class="lb-btn lb-prev" aria-label="Anterior">‹</button>
  <img class="lightbox-img" src="" alt="Fotografía de la galería">
  <button class="lb-btn lb-next" aria-label="Siguiente">›</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/anim.js"></script>
<script src="assets/js/galeria.js"></script>
</body>
</html>
