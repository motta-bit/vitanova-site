<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITULO}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Diapositivas 1920×1080 con la identidad de vitanovacolombia.org:
     verde bosque, papel crema, anillos del logo, DM Serif Display + Montserrat. */
  @page { size: 1920px 1080px; margin: 0; }
  :root {
    --bg: #F5F2EB; --paper: #FBF9F4; --plate: #ECE7DC; --ink: #0F2E26; --ink-soft: #3D5A51; --ink-faint: #6A8178;
    --accent: #1C7F60; --accent-b: #229B76; --green: #2C8914; --glow: #55CB81; --ring: #DAD8CC;
    --line: rgba(15,46,38,.14); --line-s: rgba(15,46,38,.30);
    --forest: #0F2E26; --on-f: #F5F2EB; --on-f-soft: rgba(245,242,235,.78); --on-f-line: rgba(245,242,235,.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Montserrat', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  h1, h2, h3, h4 { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; line-height: 1.04; letter-spacing: -.01em; }
  em { font-style: italic; color: var(--accent-b); }
  .vn-logo .lg-ring { fill: var(--ring); } .vn-logo .lg-g { fill: #2C8914; } .vn-logo .lg-t { fill: #229B76; } .vn-logo .lg-gi { fill: #2DB962; } .vn-logo .lg-ti { fill: #55CB81; }

  .s { position: relative; width: 1920px; height: 1080px; overflow: hidden; padding: 110px 130px; page-break-after: always; break-after: page; background: var(--bg); }
  .s:last-child { page-break-after: auto; }
  .s::before { content: ""; position: absolute; width: 620px; height: 620px; right: -200px; top: -240px; border-radius: 50%; border: 48px solid rgba(34,155,118,.08); }
  .s.paper { background: var(--paper); }
  .s.forest { background: var(--forest); color: var(--on-f); }
  .s.forest em, .s.forest .kicker, .s.forest .tag { color: var(--glow); }
  .s.forest p, .s.forest .lead { color: var(--on-f-soft); }
  .s.forest::before { border-color: rgba(85,203,129,.08); }
  .bgimg { background-size: cover; background-position: center; }
  .s > * { position: relative; }
  .folio { position: absolute; right: 120px; bottom: 50px; font-family: 'DM Serif Display', serif; font-size: 240px; line-height: .8; color: transparent; -webkit-text-stroke: 2px var(--line-s); }
  .s.forest .folio { -webkit-text-stroke-color: var(--on-f-line); }

  .kicker { font-weight: 800; font-size: 19px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .tag { display: block; font-weight: 800; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 168px; line-height: .92; margin-top: 26px; letter-spacing: -.025em; }
  h2 { font-size: 92px; margin-top: 22px; max-width: 17ch; }
  h2.h-sm { font-size: 72px; }
  h3 { font-size: 44px; margin-top: 8px; }
  h4 { font-size: 34px; }
  .lead { font-size: 27px; line-height: 1.6; color: var(--ink-soft); margin-top: 30px; max-width: 46ch; }
  .small-lead { font-size: 22px; line-height: 1.55; color: var(--ink-soft); margin-top: 18px; }
  p { font-size: 22px; line-height: 1.55; color: var(--ink-soft); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 100px; align-items: start; height: 100%; }
  .grid2.wide-img { grid-template-columns: .9fr 1.1fr; align-items: center; margin: -110px 0 -110px -130px; height: 1080px; }
  .photo { height: 1080px; background-size: cover; background-position: center; }

  /* portada */
  .cover { display: grid; grid-template-columns: 1.1fr .9fr; padding: 0; }
  .cover-txt { padding: 90px 110px 80px 130px; display: flex; flex-direction: column; justify-content: space-between; }
  .cover-img { background-size: cover; background-position: 50% 30%; }
  .nameplate { display: flex; align-items: center; gap: 26px; margin-bottom: 40px; }
  .nameplate .vn-logo { width: 130px; height: auto; }
  .word { font-family: 'DM Serif Display', serif; font-size: 80px; line-height: .95; }
  .tagline { display: block; margin-top: 10px; font-size: 16px; font-weight: 800; letter-spacing: .3em; color: var(--accent); }
  .dek { font-size: 30px; line-height: 1.55; color: var(--ink-soft); margin-top: 34px; max-width: 40ch; }
  .issue { display: flex; gap: 40px; border-top: 1px solid var(--line-s); padding-top: 22px; font-size: 16px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }

  blockquote { margin-top: 50px; padding-left: 34px; border-left: 4px solid var(--accent-b); font-family: 'DM Serif Display', serif; font-size: 40px; line-height: 1.22; max-width: 26ch; }
  .cards2 { display: grid; gap: 26px; }
  .card { border: 1px solid var(--line-s); background: var(--paper); padding: 34px 38px; }
  .card p { margin-top: 12px; }

  /* cifras */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 50px; margin-top: 70px; border-top: 2px solid var(--on-f); padding-top: 34px; }
  .stats b { display: block; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 96px; line-height: .95; color: var(--on-f); }
  .stats span { display: block; margin-top: 14px; font-size: 21px; line-height: 1.45; color: var(--on-f-soft); }
  .triad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 50px; margin-top: 70px; }
  .triad h4 { margin-top: 6px; font-size: 36px; }
  .triad p { margin-top: 10px; font-size: 19px; }

  /* mapa */
  .grid-map { display: grid; grid-template-columns: 720px 1fr; gap: 70px; height: 100%; margin-top: -50px; }
  .grid-map h2.h-sm { font-size: 60px; }
  .map-box { display: flex; flex-direction: column; align-items: center; }
  .mapa { width: 660px; height: 880px; }
  .dptos path { fill: var(--plate); stroke: rgba(15,46,38,.35); stroke-width: .6; stroke-linejoin: round; }
  .borde { fill: none; stroke: var(--ink-soft); stroke-width: 2; }
  .rutas path { fill: none; stroke: var(--accent-b); stroke-width: 1.6; stroke-dasharray: 4 5; opacity: .8; }
  .pt circle { fill: #fff; stroke: var(--accent-b); stroke-width: 2.4; }
  .pt.sede circle { fill: var(--green); stroke: #fff; }
  .pt.activo circle { fill: var(--accent-b); stroke: #fff; }
  .pt.creacion circle { stroke-dasharray: 3 2; }
  .pt.ruta circle { stroke: var(--glow); }
  .pt text { font: 800 8.5px 'Montserrat', sans-serif; text-anchor: middle; fill: var(--ink); }
  .pt.sede text, .pt.activo text { fill: #fff; }
  .legend { list-style: none; display: flex; gap: 26px; font-size: 17px; color: var(--ink-faint); margin-top: 6px; }
  .legend i { display: inline-block; width: 15px; height: 15px; border-radius: 50%; margin-right: 8px; vertical-align: -2px; }
  .legend .sede { background: var(--green); } .legend .activo { background: var(--accent-b); }
  .legend .creacion { border: 2px dashed var(--accent-b); } .legend .ruta { border: 2px solid var(--glow); }
  .terr { list-style: none; display: grid; grid-template-columns: 1fr 1fr; column-gap: 34px; margin-top: 22px; }
  .terr li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .terr .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; border: 2.5px solid var(--glow); background: #fff; }
  .terr .n.sede { background: var(--green); border-color: var(--green); color: #fff; }
  .terr .n.activo { background: var(--accent-b); border-color: var(--accent-b); color: #fff; }
  .terr .n.creacion { border: 2.5px dashed var(--accent-b); }
  .terr strong { font-size: 18px; }
  .terr .lugar { font-size: 14px; color: var(--ink-faint); }
  .terr em { display: block; font-style: normal; font-size: 12.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-top: 1px; }
  .terr small { display: block; font-size: 13px; line-height: 1.35; color: var(--ink-soft); }

  .block { margin-top: 44px; }
  .block p { margin-top: 12px; }

  .mods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px 60px; margin-top: 60px; }
  .mods > div { border-top: 2px solid var(--accent-b); padding-top: 22px; }
  .pn { font-family: 'DM Serif Display', serif; font-size: 50px; line-height: 1; color: var(--accent-b); }
  .mods h4 { margin-top: 10px; }
  .mods p { margin-top: 12px; font-size: 20px; }

  .route { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; margin-top: 70px; position: relative; padding-top: 48px; }
  .route::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 3px; background: var(--accent-b); }
  .route > div { position: relative; }
  .route > div::before { content: ""; position: absolute; top: -48px; left: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--bg); border: 4px solid var(--accent-b); }
  .route .m { font-size: 16px; font-weight: 800; letter-spacing: .16em; color: var(--accent); }
  .route h4 { margin-top: 8px; font-size: 32px; }
  .route p { margin-top: 8px; font-size: 20px; }
  .tags { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
  .tags span { border: 1px solid var(--line-s); border-radius: 999px; padding: 10px 22px; font-size: 19px; font-weight: 600; color: var(--ink-soft); }

  .scale { display: grid; gap: 18px; margin-top: 26px; }
  .scale > div { display: grid; grid-template-columns: 170px 150px 1fr; align-items: center; gap: 24px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .scale i { justify-self: center; width: var(--s); height: var(--s); max-width: 164px; border-radius: 50%; background: radial-gradient(circle, #55CB81 0 32%, #229B76 33% 100%); box-shadow: 0 0 0 7px var(--ring); }
  .scale small { font-size: 15px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  .scale b { grid-column: 3; grid-row: 1; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 52px; line-height: 1; }
  .scale span { grid-column: 3; font-size: 19px; color: var(--ink-faint); margin-top: -10px; }
  .scale small { grid-column: 2; grid-row: 1; }

  .ficha { list-style: none; margin-top: 40px; }
  .ficha li { display: flex; justify-content: space-between; gap: 20px; padding: 16px 0; border-bottom: 1px dashed var(--on-f-line); font-size: 22px; color: var(--on-f-soft); }
  .ficha b { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 32px; color: var(--on-f); }
  .ledger { display: grid; grid-template-columns: 1fr 1fr; gap: 34px 40px; margin-top: 44px; border-top: 2px solid var(--on-f); padding-top: 30px; }
  .ledger b { display: block; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 62px; line-height: 1; color: var(--on-f); }
  .ledger span { display: block; margin-top: 10px; font-size: 20px; color: var(--on-f-soft); }
  .fine { margin-top: 30px; font-size: 16px; }

  .allies { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid var(--ink); margin-top: 46px; }
  .ally { padding: 24px 26px 24px 0; border-bottom: 1px solid var(--line); }
  .ally:not(:nth-child(4n+1)) { padding-left: 26px; border-left: 1px solid var(--line); }
  .ally img { height: 74px; max-width: 200px; object-fit: contain; display: block; margin-bottom: 14px; }
  .ally .mono { display: flex; align-items: center; height: 74px; margin-bottom: 14px; font-family: 'DM Serif Display', serif; font-size: 34px; line-height: 1; color: var(--accent-b); }
  .ally h4 { font-size: 26px; margin-top: 6px; }
  .ally p { font-size: 16px; margin-top: 6px; }
  .note { margin-top: 30px; padding: 18px 26px; border-left: 4px solid var(--accent-b); background: var(--bg); font-size: 21px; }

  .eco { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 50px; }
  .eco > div { border: 1px solid var(--on-f-line); padding: 30px 34px; }
  .eco h4 { font-size: 34px; margin-bottom: 10px; }
  .eco .tag { margin-top: 16px; }
  .eco p { margin-top: 6px; font-size: 20px; }
  .formas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 24px; margin-top: 22px; }
  .formas > div { border-top: 1px solid var(--on-f-line); padding-top: 16px; }
  .formas .mn { font-family: 'DM Serif Display', serif; font-size: 42px; color: var(--glow); display: block; line-height: 1; }
  .formas .tag { color: var(--on-f-soft) !important; margin-top: 10px; font-size: 13px; }
  .formas h4 { font-size: 25px; margin-top: 6px; color: var(--on-f); }

  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 30px; margin-top: 60px; }
  .steps > div { border-top: 3px solid var(--accent-b); padding-top: 24px; }
  .steps .m { font-size: 15px; font-weight: 800; letter-spacing: .16em; color: var(--accent); }
  .steps h4 { margin-top: 8px; font-size: 30px; }
  .steps p { margin-top: 10px; font-size: 19px; }
  .soon { margin-top: 60px; border: 1px dashed var(--line-s); padding: 30px 40px; max-width: 1100px; }
  .soon p { margin-top: 10px; }

  .quote { display: flex; align-items: center; justify-content: center; }
  .quote blockquote { border: 0; padding: 0; margin: 0; max-width: 24ch; text-align: center; font-size: 72px; line-height: 1.16; color: #F5F2EB; }

  .back .grid2 { align-items: center; height: auto; margin-top: -20px; }
  .contact { list-style: none; margin-top: 44px; }
  .contact li { display: grid; grid-template-columns: 170px 1fr; gap: 20px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 24px; font-weight: 600; }
  .contact span { font-size: 15px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); padding-top: 6px; }
  .contact a { color: var(--ink); text-decoration: none; }
  .back-logo { text-align: center; }
  .back-logo .vn-logo { width: 380px; height: auto; }
  .back-logo .word { font-size: 110px; margin-top: 24px; }
  .back-logo .tagline { font-size: 20px; margin-top: 16px; }
  .colophon { position: absolute; left: 130px; right: 130px; bottom: 60px; border-top: 1px solid var(--line-s); padding-top: 18px; font-size: 17px; color: var(--ink-faint); }
</style>
</head>
<body>
{{SLIDES}}
</body>
</html>
