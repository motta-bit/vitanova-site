<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Eventos y talleres de Vita Nova Colombia — inscríbete como persona natural, empresa, fundación o entidad pública.">
<title>Eventos — Vita Nova Colombia</title>
<link rel="icon" type="image/jpeg" href="assets/img/img_00.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<header class="page-hero" data-dark>
  <div class="ph-glow"></div><div class="ph-glow g2"></div>
  <span class="section-label">Agenda</span>
  <h1>Próximos eventos</h1>
  <p class="ph-sub">Inscríbete con tu cuenta: clasificamos tu registro como persona natural, empresa, fundación o entidad pública, y atendemos tus necesidades de accesibilidad.</p>
</header>

<section id="eventos" style="background:var(--plum-light)" aria-label="Listado de eventos">
  <div class="eventos-grid" id="eventos-grid"></div>
</section>

<div class="modal-backdrop" id="evento-modal" role="dialog" aria-modal="true" aria-label="Inscripción a evento">
  <div class="modal">
    <button class="modal-close" aria-label="Cerrar">✕</button>
    <h3 id="ev-title"></h3>
    <p class="m-sub" id="ev-meta"></p>
    <p class="demo-note" id="ev-user" style="background:var(--teal-pale);color:var(--teal-deep)"></p>
    <form id="evento-form">
      <div><label for="ev-cant">Número de asistentes</label><input id="ev-cant" type="number" min="1" max="20" value="1" required></div>
      <div><label for="ev-com">Comentario o necesidades de accesibilidad (opcional)</label><textarea id="ev-com" placeholder="Ej.: requiero intérprete de señas, rampa, material en braille…"></textarea></div>
      <div class="form-msg" id="ev-msg"></div>
      <button class="btn-primary" type="submit" style="justify-content:center;background:var(--plum)">Confirmar inscripción</button>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/anim.js"></script>
<script src="assets/js/eventos.js"></script>
</body>
</html>
